name: Auto Sync Fork

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do fork
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Sincronizar com o repositorio original
        shell: bash
        run: |
          set -euo pipefail

          # Repositorio de origem confirmado
          UPSTREAM="DarkyHArry/cassandra-agent"
          BRANCH="main"

          echo "Buscando atualizacoes de ${UPSTREAM}:${BRANCH}"
          git fetch "https://github.com/${UPSTREAM}.git" "${BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nunca descarta commits do fork; conflitos interrompem o job.
          git merge --no-edit FETCH_HEAD
          git push origin "HEAD:${BRANCH}"

          echo "Sincronizacao concluida."
